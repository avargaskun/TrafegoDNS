name: pr-check

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  pr-check:
    name: pr-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '23.11.1'
      - run: npm ci
      - name: Test
        run: |
          if [ -d test ]; then npm test; else echo "No test/ directory yet; skipping npm test"; fi
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker-s6/Dockerfile
          platforms: linux/amd64
          push: false
